name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      # Installable test build: download it from the run's Artifacts and open it on an Android phone.
      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jr-stone-workflow-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Fixed download link for testers:
      # https://github.com/<owner>/<repo>/releases/download/android-test/JR-Stone-WorkFlow.apk
      - name: Publish test APK to the android-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JR-Stone-WorkFlow.apk
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --prerelease --title "Android test build" \
              --notes "Latest Android test build of JR Stone WorkFlow. Open this page on an Android phone, tap JR-Stone-WorkFlow.apk and install it."
          gh release upload android-test JR-Stone-WorkFlow.apk --clobber

      # Signed Play Store bundle, only once the signing secrets are added to the repo.
      - name: Build signed release bundle
        if: env.HAS_ANDROID_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - if: env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jr-stone-workflow-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
