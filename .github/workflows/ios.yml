name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios

      # Always runs: proves the project compiles, no Apple account needed.
      - name: Build for simulator
        if: env.HAS_APPLE_SIGNING != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      # Once the Apple secrets are added: archive, sign and upload to TestFlight.
      - name: Archive and upload to TestFlight
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # the key can be pasted as-is (ASC_KEY_P8) or base64-encoded (ASC_KEY_P8_BASE64)
          RAW="${ASC_KEY_P8:-$ASC_KEY_P8_BASE64}"
          if printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$RAW" > "$KEY"
          else
            B64=$(printf '%s' "$RAW" | tr -d ' \r\n')
            printf '%s' "$B64" | base64 -D > "$KEY" 2>/dev/null || true
            # only the lines between BEGIN and END were pasted: put the header and footer back
            grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$B64" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::The App Store Connect key secret doesn't contain a private key. Paste the whole .p8 file text (from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----) into the ASC_KEY_P8 secret."; exit 1; }
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
